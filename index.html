<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>लक्ष्य ट्रैकर · Target Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===================== AUTH SCREEN ===================== -->
  <div id="authScreen" class="auth-wrap">
    <div class="lang-toggle auth-lang" id="authLangToggle">
      <button data-lang="hi">हिं</button>
      <button data-lang="en">EN</button>
    </div>
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">लT</div>
        <h1 data-i18n="appName">लक्ष्य ट्रैकर</h1>
      </div>
      <p class="tagline" data-i18n="tagline">आपकी टीम के daily काम और targets, एक जगह</p>

      <div id="authError" class="auth-error hidden"></div>

      <!-- Login form -->
      <div id="loginForm">
        <div class="field">
          <label data-i18n="name">नाम</label>
          <input type="text" id="loginName" data-i18n-placeholder="namePlaceholder" placeholder="अपना नाम लिखें">
        </div>
        <div class="field">
          <label data-i18n="password">पासवर्ड</label>
          <input type="password" id="loginPass" placeholder="••••••">
        </div>
        <button class="btn btn-primary btn-block" id="loginBtn" data-i18n="loginBtn">लॉगिन करें</button>
        <p class="auth-switch"><span data-i18n="noAccount">नया अकाउंट नहीं है?</span> <a id="toSignup" data-i18n="switchToSignup">Sign up करें</a></p>
        <p class="auth-switch"><a id="toReset" data-i18n="forgotPassword">पासवर्ड भूल गए?</a></p>
      </div>

      <!-- Forgot password form -->
      <div id="resetForm" class="hidden">
        <div class="field">
          <label data-i18n="name">नाम</label>
          <input type="text" id="resetName" data-i18n-placeholder="namePlaceholder" placeholder="अपना नाम लिखें">
        </div>
        <div class="field">
          <label data-i18n="newPassword">नया पासवर्ड</label>
          <input type="password" id="resetPass" placeholder="कम से कम 4 अक्षर">
        </div>
        <div class="field">
          <label data-i18n="confirmPassword">पासवर्ड फिर से लिखें</label>
          <input type="password" id="resetPass2" placeholder="••••••">
        </div>
        <button class="btn btn-primary btn-block" id="resetBtn" data-i18n="resetPasswordBtn">पासवर्ड बदलें</button>
        <p class="auth-switch"><a id="resetToLogin" data-i18n="switchToLogin">लॉगिन करें</a></p>
      </div>

      <!-- Signup form -->
      <div id="signupForm" class="hidden">
        <div class="field">
          <label data-i18n="name">नाम</label>
          <input type="text" id="signupName" data-i18n-placeholder="namePlaceholder" placeholder="अपना पूरा नाम लिखें">
        </div>
        <div class="field">
          <label data-i18n="password">पासवर्ड</label>
          <input type="password" id="signupPass" placeholder="कम से कम 4 अक्षर">
        </div>
        <div class="field">
          <label data-i18n="confirmPassword">पासवर्ड फिर से लिखें</label>
          <input type="password" id="signupPass2" placeholder="••••••">
        </div>
        <button class="btn btn-accent btn-block" id="signupBtn" data-i18n="signupBtn">Account बनाएं</button>
        <p class="auth-switch"><span data-i18n="haveAccount">पहले से अकाउंट है?</span> <a id="toLogin" data-i18n="switchToLogin">लॉगिन करें</a></p>
      </div>

      <div id="debugUsers" style="font-size:11px;color:var(--muted);text-align:center;margin-top:14px;border-top:1px dashed var(--border);padding-top:10px;">…</div>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="shell" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">लT</div>
        <h1 data-i18n="appName">लक्ष्य ट्रैकर</h1>
      </div>
      <nav>
        <div class="nav-item" data-view="dashboard"><span class="nav-icon">◆</span><span data-i18n="dashboard">डैशबोर्ड</span></div>
        <div class="nav-item" data-view="daily"><span class="nav-icon">☰</span><span data-i18n="dailyTodo">Daily To-Do</span></div>
        <div class="nav-item" data-view="weekly"><span class="nav-icon">▤</span><span data-i18n="weeklyTargets">Weekly Targets</span></div>
        <div class="nav-item" data-view="monthly"><span class="nav-icon">▦</span><span data-i18n="monthlyTargets">Monthly Targets</span></div>
        <div class="nav-item" data-view="annual"><span class="nav-icon">★</span><span data-i18n="annualReview">Annual Review</span></div>
        <div class="nav-item hidden" id="teamNavItem" data-view="team"><span class="nav-icon">◈</span><span data-i18n="teamOverview">Team Overview</span></div>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="user-avatar" id="sideAvatar">A</div>
          <div class="user-meta">
            <div class="u-name" id="sideName">—</div>
            <div class="u-role" id="sideRole">—</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtn" data-i18n="logout">लॉगआउट</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h2 id="viewTitle" data-i18n="dashboard">डैशबोर्ड</h2>
        <div class="topbar-right">
          <div class="lang-toggle" id="mainLangToggle">
            <button data-lang="hi">हिं</button>
            <button data-lang="en">EN</button>
          </div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
